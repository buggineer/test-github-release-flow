name: Slack Notification
description: Sends a deployment status notification to Slack
inputs:
  headline:
    description: Shows as a header in Slack
    required: true
  color:
    description: Color of the "quote" line, the left border of the message
    required: true
  message:
    description: Body of the slack message
    required: true
  workflow_url:
    description: URL to the workflow run
    required: true
  slack_webhook_url:
    description: Webhook to the Slack bot
    required: true
runs:
  using: composite
  steps:
    - name: Send Slack notification
      uses: slackapi/slack-github-action@v2.0.0
      with:
        webhook: ${{ inputs.slack_webhook_url }}
        webhook-type: incoming-webhook
        payload: |
          {
            "attachments": [
              {
                "color": "${{ inputs.color }}",
                "blocks": [
                  {
                    "type": "header",
                    "text": {
                      "type": "plain_text",
                      "text": "${{ inputs.headline }}",
                    }
                  },
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "${{ inputs.message }}"
                    }
                  },
                  {
                    "type": "divider"
                  },
                  {
                    "type": "section",
                    "block_id": "section567",
                    "text": {
                      "type": "mrkdwn",
                      "text": "Build workflow: ${{ inputs.workflow_url }}"
                    }
                  }
                ]
              }
            ]
          }
