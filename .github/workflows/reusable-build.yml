name: Build and test (reusable)

# Lint, test and build the app for one Vite mode and upload `dist-<mode>`.

on:
  workflow_call:
    inputs:
      mode:
        description: Vite mode (development, staging, beta, production)
        type: string
        required: true
      ref:
        description: Git ref to build (e.g. refs/tags/v3.8.0). Empty = the commit that triggered the run.
        type: string
        default: ''
      version:
        description: Version shown in the app (VITE_APP_VERSION). Empty = package.json version via .env.
        type: string
        default: ''
    outputs:
      base_url:
        description: VITE_BASE_URL from .env.<mode> of the built ref (empty if not set)
        value: ${{ jobs.build_and_test.outputs.base_url }}

permissions:
  contents: read

jobs:
  build_and_test:
    name: Build and test (${{ inputs.mode }})
    runs-on: ubuntu-latest
    outputs:
      base_url: ${{ steps.base_url.outputs.base_url }}
    env:
      npm_config_mode: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: true
          lfs: false

      # The environment's public URL, used as the link on the Environments page.
      # Read from the same .env file the build uses, so there is one source of truth.
      - name: Read VITE_BASE_URL
        id: base_url
        env:
          MODE: ${{ inputs.mode }}
        run: |
          FILE=".env.$MODE"
          URL=""
          if [ -f "$FILE" ]; then
            URL=$(grep -E '^[[:space:]]*VITE_BASE_URL[[:space:]]*=' "$FILE" | tail -n 1 | cut -d= -f2- | tr -d "\"' \r" || true)
          fi
          if [[ "$URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?(/[^[:space:]]*)?$ ]]; then
            echo "base_url=$URL" >> "$GITHUB_OUTPUT"
            echo "Environment URL: $URL"
          else
            echo "::warning::No valid VITE_BASE_URL in $FILE - the environment will have no link."
          fi

      # Real env vars take precedence over .env files in Vite, so this overrides
      # VITE_APP_VERSION=$npm_package_version. Only set when a version is given,
      # because an empty env var would also override it (with an empty string).
      - name: Set app version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: echo "VITE_APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Run Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Copy assets
        run: npm run copy-assetlinks && npm run copy-robots
      - name: List 'dist' directory contents
        run: ls -laR dist
      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ inputs.mode }}
          path: dist
          include-hidden-files: true
          retention-days: 14
